<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hourly Packages – Green Eagle Tours</title>

<link rel="icon" href="images/logo.png">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;600&family=Inter:wght@400;600&display=swap" rel="stylesheet">

<!-- PAGE ONLY FIXES -->
<style>
.book-now-fast,
.book-now-fast:hover,
.book-now-fast:active,
.book-now-fast:focus {
  transition: none !important;
  animation: none !important;
  transform: none !important;
}
.book-now-fast span {
  color: #ffffff !important;
  position: relative;
  z-index: 3;
}
.package-toggle button.active {
  background: var(--gold);
  color: #0f172a;
}
</style>
</head>

<body>

<!-- NAVBAR (NO TOGGLER – SAME AS INDEX) -->
<script src="header.js"></script>

<!-- MOBILE MENU -->



<!-- HERO -->
<section class="hero-section" style="min-height:65vh">
  <div class="hero-bg"></div>
  <div class="container hero-content text-center">
    <div style="color:var(--gold);letter-spacing:3px;font-size:14px;">COIMBATORE CITY</div>
    <h1 class="hero-title">Hourly Cab Packages</h1>
    <p class="hero-subtitle mx-auto" style="max-width:700px;">
      Flexible city travel with professional drivers & transparent pricing.
    </p>
  </div>
</section>

<!-- PACKAGE TOGGLE -->
<section style="background:#0f172a;">
<div class="container py-5">

<div class="text-center mb-4 package-toggle">
  <button class="btn btn-outline-light me-2 active" onclick="loadPackage('8')" id="btn8">
    8 Hrs / 80 Km
  </button>
  <button class="btn btn-outline-light" onclick="loadPackage('10')" id="btn10">
    10 Hrs / 100 Km
  </button>
</div>

<div class="row g-4" id="vehicleGrid"></div>

</div>
</section>

<!-- BOOKING MODAL -->
<div class="modal" id="bookingModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content" style="background:#0a1929;color:#fff;">
      <div class="modal-header border-0">
        <h5 class="modal-title">Book Hourly Cab</h5>
        <button class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">

        <input class="form-control mb-3" id="pickup" placeholder="Pickup Location" required>

        <input class="form-control mb-3" id="drop" placeholder="Drop Location" required>

        <label class="form-label">Pickup Date & Time</label>
        <input class="form-control mb-3" type="datetime-local" id="pickupTime" required>

    <button class="btn-luxury book-now-fast w-100" id="whatsBtn" onclick="sendWhatsApp()">
    <span>Send WhatsApp</span>
  </button>

  <small class="text-danger d-none" id="dateError">
    Pickup date & time must be in the future
  </small>

  </div>

        </button>
      </div>
    </div>
  </div>
</div>
<!-- FOOTER -->
<script src="footer.js"></script>

<!-- FLOATING ACTION BAR (MOBILE – SAME AS INDEX) -->


<!-- SCRIPTS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="script.js"></script>

<script>

pickup.addEventListener("input", toggleWhatsBtn);
drop.addEventListener("input", toggleWhatsBtn);
pickupTime.addEventListener("change", toggleWhatsBtn);


  const rates={
8:[
{v:"Swift Dzire 4+1",t:"Sedan",p:"₹2800",eh:"₹300",km:"₹13"},
{v:"Toyota Etios 4+1",t:"Sedan",p:"₹2800",eh:"₹300",km:"₹13"},
{v:"Ertiga 6+1",t:"SUV",p:"₹3300",eh:"₹400",km:"₹15"},
{v:"Innova A/C 7+1",t:"MPV",p:"₹3700",eh:"₹400",km:"₹15"},
{v:"Innova Crysta 6+1 / 7+1",t:"Premium MPV",p:"₹4500",eh:"₹500",km:"₹16"},
{v:"Tempo Traveller 12-14",t:"Force",p:"₹5200",eh:"₹500",km:"₹20"}
],
10:[
{v:"Swift Dzire 4+1",t:"Sedan",p:"₹3000",eh:"₹300",km:"₹13"},
{v:"Toyota Etios 4+1",t:"Sedan",p:"₹3000",eh:"₹300",km:"₹13"},
{v:"Ertiga 6+1",t:"SUV",p:"₹3600",eh:"₹400",km:"₹15"},
{v:"Innova A/C 7+1",t:"MPV",p:"₹4000",eh:"₹400",km:"₹15"},
{v:"Innova Crysta 6+1 / 7+1",t:"Premium MPV",p:"₹5000",eh:"₹500",km:"₹16"},
{v:"Tempo Traveller 12- 14",t:"Force",p:"₹5500",eh:"₹500",km:"₹20"}
]
};

let current={};

function loadPackage(h){
document.getElementById("btn8").classList.toggle("active",h==="8");
document.getElementById("btn10").classList.toggle("active",h==="10");
const g=document.getElementById("vehicleGrid");g.innerHTML="";
rates[h].forEach(r=>{
g.innerHTML+=`
<div class="col-md-4">
<div class="feature-card h-100">
<h5>${r.v}</h5>
<p>${r.t}</p>
<p><strong>${h==="8"?"8H/80Km Limit":"10H/100Km Limit"}:</strong> ${r.p}</p>
<p>Extra Hr: ${r.eh} | Extra Km: ${r.km}</p>
<button class="btn-luxury book-now-fast w-100"
onclick="openBooking('${r.v}','${r.t}','${h}','${r.p}','${r.eh}','${r.km}')">
<span>Book Now</span>
</button>
</div>
</div>`;
});
}

function openBooking(v,t,p,pr,eh,km){
  document.getElementById("whatsBtn").disabled = true;
document.getElementById("whatsBtn").style.opacity = "0.6";

current={v,t,p,pr,eh,km};
new bootstrap.Modal(document.getElementById("bookingModal")).show();
}

function formatAMPM(d){
const x=new Date(d);
let h=x.getHours(),m=x.getMinutes(),ap=h>=12?"PM":"AM";
h=h%12||12;m=m<10?"0"+m:m;
return `${x.getDate()}-${x.getMonth()+1}-${x.getFullYear()} ${h}:${m} ${ap}`;
}

document.getElementById("pickupTime").addEventListener("change", validatePickupTime);

function validatePickupTime() {
  const pickupVal = document.getElementById("pickupTime").value;
  const btn = document.getElementById("whatsBtn");
  const err = document.getElementById("dateError");

  if (!pickupVal) return;

  const selected = new Date(pickupVal);
  const now = new Date();

  if (selected < now) {
    btn.style.display = "none";
    err.classList.remove("d-none");
  } else {
    btn.style.display = "block";
    err.classList.add("d-none");
  }
}
function toggleWhatsBtn() {
  const btn = document.getElementById("whatsBtn");

  if (
    pickup.value.trim() &&
    drop.value.trim() &&
    pickupTime.value &&
    new Date(pickupTime.value) > new Date()
  ) {
    btn.disabled = false;
    btn.style.opacity = "1";
  } else {
    btn.disabled = true;
    btn.style.opacity = "0.6";
  }
}


function sendWhatsApp() {
  const pickupVal = pickup.value.trim();
  const dropVal = drop.value.trim();
  const timeVal = pickupTime.value;

  if (!pickupVal || !dropVal || !timeVal) {
    alert("Please fill Pickup location, Drop location, and Pickup Date & Time");
    return;
  }

  const pickupDate = new Date(timeVal);
  const now = new Date();

  if (pickupDate <= now) {
    alert("Pickup date & time must be in the future");
    return;
  }

  const msg = `🚖 *HOURLY CAB BOOKING ENQUIRY*

🚗 ${current.v} (${current.t})
📦 ${current.p === "8" ? "8H / 80KM" : "10H / 100KM"}
💰 ${current.pr}

📍 *Pickup:* ${pickupVal}
🏁 *Drop:* ${dropVal}
🕒 *Pickup Time:* ${formatAMPM(timeVal)}

✨ Please share confirmation & driver details`;

  window.open(
    "https://wa.me/919751415617?text=" + encodeURIComponent(msg),
    "_blank"
  );
}




window.onload=()=>loadPackage("8");


function setMinPickupDateTime() {
  const now = new Date();
  now.setMinutes(now.getMinutes() - now.getTimezoneOffset());

  document.getElementById("pickupTime").min = now.toISOString().slice(0,16);
}

window.onload = () => {
  loadPackage("8");
  setMinPickupDateTime();
};

</script>

</body>
</html>
